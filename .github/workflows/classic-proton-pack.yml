name: Publish classic Proton starter runners

on:
  push:
    branches: [main]
    paths:
      - scripts/build-classic-proton-pack.py
      - .github/workflows/classic-proton-pack.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classic-proton-starter-pack
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify missing classic runners
        run: python3 scripts/build-classic-proton-pack.py
      - name: Publish runner archives and updated checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.xz)
          if [ "${#archives[@]}" -gt 0 ]; then
            gh release upload starter-pack-2026.10 "${archives[@]}"
          fi
          gh release upload starter-pack-2026.10 dist/SHA256SUMS.txt --clobber
      - name: Update starter pack release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit starter-pack-2026.10 --notes-file release-notes/starter-pack-2026.10.md
      - name: Commit verified catalog metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runners.json starter-pack.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified classic runners to the starter pack'
            git push origin HEAD:main
          fi
