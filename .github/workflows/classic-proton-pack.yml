name: Publish classic Proton starter runners

on:
  push:
    branches: [main]
    paths:
      - scripts/build-classic-proton-pack.py
      - .github/workflows/classic-proton-pack.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classic-proton-starter-pack
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the two classic runners
        run: python3 scripts/build-classic-proton-pack.py
      - name: Publish runner archives and updated checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload starter-pack-2026.10 \
            dist/GE-Proton10-10.tar.xz dist/proton-EM-10.0-37-HDR.tar.xz \
            dist/SHA256SUMS.txt --clobber
      - name: Commit verified catalog metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runners.json starter-pack.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update starter pack with classic GE/EM and GE-Proton11-7-UMU'
            git push origin HEAD:main
          fi
